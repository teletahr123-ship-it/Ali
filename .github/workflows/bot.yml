name: Library Bot

on:
  push:
    branches: [main]
  workflow_dispatch:

# تشغيل نسخة واحدة فقط (مهم: نفس الجلسة لا تعمل من مكانين معا)
concurrency:
  group: library-bot
  cancel-in-progress: true

permissions:
  contents: read
  actions: write   # مطلوب لإعادة تشغيل الـ workflow تلقائيا

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run bot
        env:
          API_ID:          ${{ secrets.API_ID }}
          API_HASH:        ${{ secrets.API_HASH }}
          SESSION_STR:     ${{ secrets.SESSION_STR }}
          GROUP_ID:        ${{ secrets.GROUP_ID }}
          RECEIVER_BOT_ID: ${{ secrets.RECEIVER_BOT_ID }}
          CHANNELS:        ${{ secrets.CHANNELS }}
          MONGODB_URI:     ${{ secrets.MONGODB_URI }}
          MONGODB_DB:      ${{ secrets.MONGODB_DB || 'book_bot' }}
        # ينهي البوت نفسه قبل 350 دقيقة حتى تعمل خطوة إعادة التشغيل
        run: timeout --signal=TERM --kill-after=30s 345m python main.py

      - name: Auto-restart bot
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          gh workflow run bot.yml \
            --repo ${{ github.repository }} \
            --ref ${{ github.ref_name }}
